<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"href="styles.css">
    <title >Useless Clicker</title>
  </head>
  <body>
    <h1>Useless Clicker</h1>
    <h2>Clicks <span id="clicks">0</span></h2>
    <h2>CPS <span id="CPS">0</span></h2>
    <h2>Best CPS of <span id="username-span"></span>: <span id="bestCPS">0</span></h2>
    <div class="button" onclick="clickButton()">
      <img src="./.assets/whiteCircle.jpeg">
    </div>
    <div id="username-input">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="username" />  
    </div>
    <script src="main.js"></script> 
  </body>
</html>
